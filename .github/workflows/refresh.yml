name: Refresh live panel

on:
  schedule:
    - cron: '23 1 * * *' # daily, 06:53 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'assets/fonts/**']

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Draw images
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          git diff --staged --quiet || (git commit -m "Refresh live panel" && git push)
